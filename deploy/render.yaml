services:
  - type: web
    name: hcmute-anime-webapp
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 8080
      - key: DB_HOST
        value: localhost
      - key: DB_NAME
        value: HCMUTE_WebDemo
      - key: DB_USER
        value: sa
      - key: DB_PASSWORD
        sync: false
